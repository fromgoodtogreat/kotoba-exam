    <!-- グローバルエラー検知 -->
    <script>
        window.addEventListener('error', function(e) {
            var errBox = document.getElementById('loading-error');
            if (errBox) {
                errBox.classList.remove('hidden');
                errBox.innerHTML += '<div><strong>実行エラー:</strong> ' + e.message + '</div>';
            }
        });
        window.addEventListener('unhandledrejection', function(e) {
            var errBox = document.getElementById('loading-error');
            if (errBox) {
                errBox.classList.remove('hidden');
                errBox.innerHTML += '<div><strong>非同期エラー:</strong> ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>';
            }
        });
    </script>

        }
        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }

        async function initApp() {
            const statusEl = document.getElementById('loading-status');
            const barEl = document.getElementById('loading-bar');
            const errorEl = document.getElementById('loading-error');

            try {
                // 内蔵辞書の登録
                CORE_RUBY_RAW.split('|').forEach(pair => {
                    const idx = pair.indexOf(':');
                    if (idx > 0) {
                        customRubyDict.set(pair.slice(0, idx), pair.slice(idx + 1));
                    }
                });

                statusEl.textContent = 'words.json を読み込んでいます...';
                barEl.style.width = '50%';

                const candidateUrls = [
                    './words.json',
                    'words.json',
                    window.location.pathname.replace(/\/[^\/]*$/, '/') + 'words.json'
                ];

                let rawText = null;
                for (const url of candidateUrls) {
                    try {
                        const res = await fetch(url, { cache: 'no-store' });
                        if (res.ok) {
                            const txt = await res.text();
                            if (txt && txt.trim().startsWith('[')) {
                                rawText = txt;
                                break;
                            }
                        }
                    } catch (fetchErr) {}
                }

                // GitHub Pages上に words.json があればそれを使用し、Canvasプレビュー等の場合は内蔵フォールバックを使用
                if (!rawText) {
                    console.info('words.json not found on this host; using built-in fallback dataset.');
                    rawText = document.getElementById('fallback-json-data').textContent;
                }

                statusEl.textContent = '問題データを準備しています...';
                barEl.style.width = '85%';

                const cleanJsonText = rawText.replace(/^\uFEFF/, '').trim();
                const rawJson = JSON.parse(cleanJsonText);

                parseWordsJson(rawJson);

                if (allWordsPool.length < 4) {
                    throw new Error(`有効な問題データが ${allWordsPool.length} 件しかありません。`);
                }

                rebuildSortedDictKeys();
                barEl.style.width = '100%';

                // バックグラウンドでKuroshiro（形態素解析）をロード（クイズの開始は一切待たせない）
                loadKuroshiroDynamicallyInBackground();

                document.getElementById('total-pool-count').textContent = allWordsPool.length;
                resetUnusedPool();
                await startNewRound();

            } catch (err) {
                console.error(err);
                errorEl.classList.remove('hidden');
                errorEl.innerHTML = `<div><strong>読み込みエラー:</strong><br>${err.message}</div>`;
            }
        }

        function loadScriptDynamic(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        async function loadKuroshiroDynamicallyInBackground() {
            try {
                await loadScriptDynamic('https://cdn.jsdelivr.net/npm/kuroshiro@1.2.0/dist/kuroshiro.min.js');
                await loadScriptDynamic('https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js');
                const KClass = window.Kuroshiro && (window.Kuroshiro.default || window.Kuroshiro);
                const AClass = window.KuromojiAnalyzer && (window.KuromojiAnalyzer.default || window.KuromojiAnalyzer);
                if (!KClass || !AClass) return;

                const instance = new KClass();
                await instance.init(new AClass({
                    dictPath: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/'
                }));
                kuroshiroObj = instance;
                kuroshiroReady = true;

                // 回答前であれば現在の問題文にも形態素解析ルビを反映
                if (!isQuestionAnswered && !document.getElementById('quiz-screen').classList.contains('hidden')) {
                    const qData = currentQuizSet[currentQuestionIndex];
                    if (qData) {
                        document.getElementById('question-text').innerHTML = await addFuriganaToAllKanji(qData.questionText);
                        const choiceSpans = document.querySelectorAll('#choices-container .choice-word-text');
                        for (let i = 0; i < choiceSpans.length; i++) {
                            if (qData.choices[i]) {
                                choiceSpans[i].innerHTML = await formatWordChoiceWithRuby(qData.choices[i]);
                            }
                        }
                    }
                }
            } catch (e) {
                console.warn('Kuroshiro background load skipped:', e);
            }
        }

        function rebuildSortedDictKeys() {
            sortedDictKeys = Array.from(customRubyDict.keys())
                .filter(k => k && /[一-龠々〆ヵヶ]/.test(k))
                .sort((a, b) => b.length - a.length);
        }

        function parseWordsJson(rawData) {
            const list = Array.isArray(rawData) ? rawData : [];
            allWordsPool = [];

            list.forEach((item, idx) => {
                if (!item || typeof item !== 'object') return;
                const rawWord = String(item.word || '').trim();
                const rawMeaning = String(item.meaning || '').trim();
                const rawExample = String(item.example || '').trim();

                if (!rawWord || !rawMeaning) return;
                if (rawWord === '語彙' && rawMeaning === '意味') return;

                const parsed = parseWordAndParentheses(rawWord);
                extractInlineReadingsFromText(rawMeaning);
                extractInlineReadingsFromText(rawExample);

                const cleanExample = rawExample.replace(/^「+/, '').replace(/」+$/, '').trim();

                allWordsPool.push({
                    id: idx,
                    rawWord: rawWord,
                    cleanWord: parsed.cleanWord,
                    preRubyHtml: parsed.preRubyHtml,
                    extractedReadings: parsed.readings,
                    altForms: parsed.altForms,
                    meaning: rawMeaning.replace(/[（\(][ぁ-んァ-ヶー]+[）\)]/g, ''),
                    example: cleanExample
                });
            });
        }

        function extractInlineReadingsFromText(text) {
            if (!text) return;
            const regex = /([一-龠々〆ヵヶ]+)[（\(]([ぁ-んァ-ヶー]+)[）\)]/g;
            let m;
            while ((m = regex.exec(text)) !== null) {
                if (m[1] && m[2]) {
                    customRubyDict.set(m[1], katakanaToHiragana(m[2]));
                }
            }
        }

        function parseWordAndParentheses(rawWord) {
            let cleanWord = rawWord;
            let preRubyHtml = rawWord;
            const readings = [];
            const altForms = [];

            const inlineRubyRegex = /([一-龠々〆ヵヶ]+)[（\(]([ぁ-んァ-ヶー・]+)[）\)]/g;
            if (inlineRubyRegex.test(rawWord)) {
                preRubyHtml = rawWord.replace(inlineRubyRegex, (match, kanji, reading) => {
                    const hira = katakanaToHiragana(reading);
                    readings.push(hira);
                    customRubyDict.set(kanji, hira);
                    return `<ruby>${kanji}<rt>${hira}</rt></ruby>`;
                });
            }

            const parenMatches = [...rawWord.matchAll(/[（\(](.*?)[）\)]/g)];
            parenMatches.forEach(m => {
                const content = m[1].trim();
                if (/^[ぁ-んァ-ヶー]+$/.test(content)) {
                    readings.push(katakanaToHiragana(content));
                } else if (content) {
                    altForms.push(content);
                }
            });

            cleanWord = rawWord.replace(/[（\(].*?[）\)]/g, '').replace(/。+$/, '').trim();
            preRubyHtml = preRubyHtml.replace(/[（\(].*?[）\)]/g, '').replace(/。+$/, '').trim();

            if (readings.length === 1 && !preRubyHtml.includes('<ruby>')) {
                const fullReading = readings[0];
                const kanjiVerbMatch = cleanWord.match(/^([一-龠々〆ヵヶ]+)([ぁ-ん]*)$/);
                if (kanjiVerbMatch) {
                    const kPart = kanjiVerbMatch[1];
                    const okuri = kanjiVerbMatch[2];
                    if (okuri && fullReading.endsWith(okuri) && fullReading.length > okuri.length) {
                        const kReading = fullReading.slice(0, fullReading.length - okuri.length);
                        customRubyDict.set(kPart, kReading);
                        preRubyHtml = `<ruby>${kPart}<rt>${kReading}</rt></ruby>${okuri}`;
                    } else if (!okuri) {
                        customRubyDict.set(kPart, fullReading);
                        preRubyHtml = `<ruby>${kPart}<rt>${fullReading}</rt></ruby>`;
                    }
                }
            }

            return { cleanWord, preRubyHtml, readings, altForms };
        }

        function katakanaToHiragana(str) {
            return str.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
        }

        function hiraganaToKatakana(str) {
            return str.replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60));
        }

        function applyBuiltinRubyToPlainSegment(segment) {
            if (!segment || !/[一-龠々〆ヵヶ]/.test(segment)) return segment;
            let work = segment;
            const replacements = [];

            for (let i = 0; i < sortedDictKeys.length; i++) {
                const key = sortedDictKeys[i];
                if (work.includes(key)) {
                    const reading = customRubyDict.get(key);
                    if (reading) {
                        const token = `\uE000${replacements.length}\uE001`;
                        replacements.push(`<ruby>${key}<rt>${reading}</rt></ruby>`);
                        work = work.split(key).join(token);
                        if (!/[一-龠々〆ヵヶ]/.test(work)) break;
                    }
                }
            }
            return work.replace(/\uE000(\d+)\uE001/g, (_, idx) => replacements[Number(idx)]);
        }

        async function addFuriganaToAllKanji(text) {
            if (!text) return '';
            const BLANK_TOKEN = '___QUIZ_BLANK_BOX___';
            let workText = String(text).replace(/【\s*[？\?]\s*】/g, BLANK_TOKEN);

            let convertedByKuroshiro = false;
            if (kuroshiroReady && kuroshiroObj) {
                try {
                    const kPromise = kuroshiroObj.convert(workText, { mode: 'furigana', to: 'hiragana' });
                    const timeoutP = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 250));
                    workText = await Promise.race([kPromise, timeoutP]);
                    convertedByKuroshiro = true;
                } catch (e) {
                    convertedByKuroshiro = false;
                }
            }

            if (!convertedByKuroshiro) {
                const parts = workText.split(/(<ruby>.*?<\/ruby>|<[^>]+>)/g);
                workText = parts.map(part => part.startsWith('<') ? part : applyBuiltinRubyToPlainSegment(part)).join('');
            }

            return workText.replace(new RegExp(BLANK_TOKEN, 'g'), '<span class="blank-box">【　？　】</span>');
        }

        async function formatWordChoiceWithRuby(wordObj) {
            const target = wordObj.cleanWord;
            if (!/[一-龠々〆ヵヶ]/.test(target)) return target;
            const strippedPre = wordObj.preRubyHtml.replace(/<ruby>.*?<\/ruby>/g, '');
            if (wordObj.preRubyHtml.includes('<ruby>') && !/[一-龠々〆ヵヶ]/.test(strippedPre)) {
                return wordObj.preRubyHtml;
            }
            return await addFuriganaToAllKanji(target);
        }

        function getHiraganaReadingSync(text) {
            if (!text) return '';
            if (/^[ぁ-んァ-ヶー]+$/.test(text)) return katakanaToHiragana(text);
            if (customRubyDict.has(text)) return customRubyDict.get(text);
            return '';
        }

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function maskTargetWordInSentence(sentence, wordObj) {
            if (!sentence) return '';
            let masked = sentence;
            const baseClean = wordObj.cleanWord.replace(/^[〜～・]+/, '').trim();
            const candidates = new Set([baseClean, ...(wordObj.altForms || [])]);

            baseClean.split('・').forEach(p => { if (p.trim()) candidates.add(p.trim()); });
            if (baseClean.includes('、')) candidates.add(baseClean.replace(/、/g, ''));

            const regexPatterns = [];

            for (const cand of candidates) {
                if (!cand) continue;
                regexPatterns.push(escapeRegExp(cand));

                for (const suffix of ['する', 'だ', 'な', 'に', 'と', 'たる', 'とした', 'として']) {
                    if (cand.endsWith(suffix) && cand.length > suffix.length) {
                        const stem = cand.slice(0, -suffix.length);
                        if (stem.length >= 2) {
                            regexPatterns.push(escapeRegExp(stem) + '(?:する|した|して|し|せ|さ|せず|しろ|だ|な|に|と|の|たる|とした|として)?');
                        }
                    }
                }

                if (/[ぁ-ん]$/.test(cand) && cand.length >= 2) {
                    const stem1 = cand.slice(0, -1);
                    if (stem1.length >= 1 && /[一-龠々〆ヵヶ]/.test(stem1)) {
                        regexPatterns.push(escapeRegExp(stem1) + '[ぁ-ん]{0,6}');
                    } else if (stem1.length >= 3) {
                        regexPatterns.push(escapeRegExp(stem1) + '[ぁ-ん]{0,5}');
                    }
                    if (/[ぁ-ん]{2}$/.test(cand) && cand.length >= 4) {
                        const stem2 = cand.slice(0, -2);
                        if (stem2.length >= 2) regexPatterns.push(escapeRegExp(stem2) + '[ぁ-ん]{0,6}');
                    }
                }

                const particlePhraseMatch = cand.match(/^(.+?)[をがにへでと](.+)$/);
                if (particlePhraseMatch) {
                    const nounPart = particlePhraseMatch[1];
                    const verbPart = particlePhraseMatch[2];
                    const verbStem = verbPart.length >= 2 ? verbPart.slice(0, -1) : verbPart;
                    if (nounPart.length >= 1 && verbStem.length >= 1) {
                        regexPatterns.push(escapeRegExp(nounPart) + '[をがにへでとのはも]?' + escapeRegExp(verbStem) + '[ぁ-ん]{0,5}');
                    }
                }

                const kanjiChunks = cand.match(/[一-龠々〆ヵヶ]{2,}/g) || [];
                kanjiChunks.forEach(kc => {
                    regexPatterns.push(escapeRegExp(kc) + '(?:する|した|して|的な|的|な|に|だ)?');
                });
            }

            const hiraReading = (wordObj.extractedReadings && wordObj.extractedReadings[0]) || getHiraganaReadingSync(baseClean);
            if (hiraReading && hiraReading.length >= 3) {
                const kataReading = hiraganaToKatakana(hiraReading);
                regexPatterns.push(escapeRegExp(hiraReading));
                regexPatterns.push(escapeRegExp(kataReading));
            }

            const uniquePatterns = Array.from(new Set(regexPatterns)).sort((a, b) => b.length - a.length);
            if (uniquePatterns.length > 0) {
                masked = masked.replace(new RegExp(uniquePatterns.join('|'), 'g'), '【　？　】');
            }

            if (!masked.includes('【　？　】') && baseClean.length >= 5) {
                const prefix4 = baseClean.slice(0, 4);
                if (masked.includes(prefix4)) {
                    masked = masked.replace(new RegExp(escapeRegExp(prefix4) + '[^、。」]*', 'g'), '【　？　】');
                }
            }

            return masked.replace(/(【\s*[？\?]\s*】)+/g, '【　？　】');
        }

        function buildQuizQuestion(targetItem, allPool) {
            const distractors = [];
            let attempts = 0;
            while (distractors.length < 2 && attempts < 200) {
                attempts++;
                const candidate = allPool[Math.floor(Math.random() * allPool.length)];
                if (
                    candidate.cleanWord !== targetItem.cleanWord &&
                    candidate.meaning !== targetItem.meaning &&
                    !distractors.some(d => d.cleanWord === candidate.cleanWord)
                ) {
                    distractors.push(candidate);
                }
            }

            const choices = [targetItem, ...distractors];
            shuffleArray(choices);

            let questionText = '';
            let badgeText = '';
            let cleanMeaning = maskTargetWordInSentence(targetItem.meaning, targetItem).replace(/。$/, '');
            const hasExample = targetItem.example && targetItem.example.length >= 3;

            if (hasExample) {
                const maskedEx = maskTargetWordInSentence(targetItem.example, targetItem);
                if (maskedEx.includes('【　？　】')) {
                    badgeText = '📝 例文あなうめクイズ';
                    questionText = `つぎの文の【　？　】に入る言葉をえらぼう！<br>『${maskedEx}』<br><span class="text-base md:text-lg text-indigo-700 font-bold mt-2 inline-block">（ヒント：${cleanMeaning}）</span>`;
                } else {
                    const situation = FUN_SITUATIONS[Math.floor(Math.random() * FUN_SITUATIONS.length)];
                    badgeText = '🌟 ことばの意味・使い方クイズ';
                    questionText = `${situation}<br>「${cleanMeaning}」という意味を持つ【　？　】に入る言葉はどれかな？<br><span class="text-base md:text-lg text-slate-600 mt-1 inline-block">（似た場面の例：『${maskedEx}』）</span>`;
                }
            } else {
                const situation = FUN_SITUATIONS[Math.floor(Math.random() * FUN_SITUATIONS.length)];
                badgeText = '💡 ことばの意味クイズ';
                questionText = `${situation}<br>「${cleanMeaning}」という意味を表す【　？　】に入る言葉は、つぎの3つのうちどれかな？`;
            }

            for (const c of choices) {
                if (c.cleanWord === targetItem.cleanWord) continue;
                if (c.cleanWord.length >= 2 && questionText.includes(c.cleanWord)) {
                    questionText = questionText.replace(new RegExp(escapeRegExp(c.cleanWord), 'g'), '〇〇');
                }
            }

            return { target: targetItem, choices, questionText, badgeText };
        }

        function resetUnusedPool() {
            unusedIndices = Array.from({ length: allWordsPool.length }, (_, i) => i);
            shuffleArray(unusedIndices);
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        async function startNewRound() {
            const roundCount = Math.min(QUESTIONS_PER_ROUND, allWordsPool.length);
            if (unusedIndices.length < roundCount) resetUnusedPool();

            const selectedIndices = unusedIndices.splice(0, roundCount);
            currentQuizSet = selectedIndices.map(idx => buildQuizQuestion(allWordsPool[idx], allWordsPool));
            currentQuestionIndex = 0;
            currentScore = 0;

            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('final-screen').classList.add('hidden');
            document.getElementById('celebration-banner').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            updateHeaderStats();
            await renderCurrentQuestion();
        }

        function updateHeaderStats() {
            const totalQ = currentQuizSet.length || QUESTIONS_PER_ROUND;
            document.getElementById('score-display').textContent = currentScore;
            document.getElementById('current-q-num').textContent = currentQuestionIndex + 1;
            document.getElementById('max-q-num').textContent = totalQ;
            document.getElementById('remaining-pool-count').textContent = unusedIndices.length;
            const progressPercent = ((currentQuestionIndex + 1) / totalQ) * 100;
            document.getElementById('quiz-progress-bar').style.width = `${progressPercent}%`;
        }

        async function renderCurrentQuestion() {
            isQuestionAnswered = false;
            const qData = currentQuizSet[currentQuestionIndex];
            const explanationArea = document.getElementById('explanation-area');
            const choicesContainer = document.getElementById('choices-container');

            explanationArea.classList.add('hidden');
            document.getElementById('celebration-banner').classList.add('hidden');
            choicesContainer.innerHTML = '';
            updateHeaderStats();

            document.getElementById('question-type-badge').innerHTML = await addFuriganaToAllKanji(qData.badgeText);
            document.getElementById('question-text').innerHTML = await addFuriganaToAllKanji(qData.questionText);

            const labels = ['①', '②', '③'];
            for (let i = 0; i < qData.choices.length; i++) {
                const choiceItem = qData.choices[i];
                const rubyWordHtml = await formatWordChoiceWithRuby(choiceItem);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'choice-btn w-full text-left p-4 md:p-5 rounded-2xl border-2 border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50/60 active:scale-[0.99] font-black text-xl md:text-2xl text-slate-800 shadow-sm transition flex items-center gap-4 group';
                btn.innerHTML = `
                    <span class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-700 group-hover:bg-indigo-600 group-hover:text-white flex items-center justify-center text-lg font-black shrink-0 transition pointer-events-none">${labels[i]}</span>
                    <span class="choice-word-text flex-1 leading-[2.0] pointer-events-none">${rubyWordHtml}</span>
                `;
                btn.addEventListener('click', () => handleChoiceSelect(i));
                choicesContainer.appendChild(btn);
            }
        }

        async function handleChoiceSelect(selectedIndex) {
            if (isQuestionAnswered) return;
            isQuestionAnswered = true;

            try {
                const qData = currentQuizSet[currentQuestionIndex];
                const selectedItem = qData.choices[selectedIndex];
                const isCorrect = (selectedItem.id === qData.target.id);

                const allButtons = document.querySelectorAll('#choices-container .choice-btn');
                allButtons.forEach((btn, idx) => {
                    btn.disabled = true;
                    btn.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50/60');
                    const item = qData.choices[idx];
                    if (item.id === qData.target.id) {
                        btn.className = 'choice-btn w-full text-left p-4 md:p-5 rounded-2xl border-2 border-emerald-500 bg-emerald-50 font-black text-xl md:text-2xl text-emerald-900 shadow-md flex items-center gap-4';
                    } else if (idx === selectedIndex && !isCorrect) {
                        btn.className = 'choice-btn w-full text-left p-4 md:p-5 rounded-2xl border-2 border-rose-400 bg-rose-50 font-black text-xl md:text-2xl text-rose-900 opacity-85 flex items-center gap-4';
                    } else {
                        btn.classList.add('opacity-50');
                    }
                });

                const feedbackBox = document.getElementById('feedback-box');
                const resultIcon = document.getElementById('result-icon');
                const resultTitle = document.getElementById('result-title');

                if (isCorrect) {
                    currentScore++;
                    document.getElementById('score-display').textContent = currentScore;
                    feedbackBox.className = 'rounded-2xl p-5 mb-6 flex items-start gap-4 border-2 bg-emerald-50/90 border-emerald-300';
                    resultIcon.textContent = getCelebrationEmoji(currentScore);
                    resultTitle.className = 'text-xl md:text-2xl font-black mb-2 text-emerald-700';
                    resultTitle.innerHTML = await addFuriganaToAllKanji(getCelebrationTitle(currentScore));
                    triggerEscalatingCelebration(currentScore);
                } else {
                    feedbackBox.className = 'rounded-2xl p-5 mb-6 flex items-start gap-4 border-2 bg-rose-50/90 border-rose-300';
                    resultIcon.textContent = '💡';
                    resultTitle.className = 'text-xl md:text-2xl font-black mb-2 text-rose-700';
                    resultTitle.innerHTML = await addFuriganaToAllKanji('おしい！ここで覚えちゃおう！');
                    playWrongSound();
                }

                // 問題文の【　？　】に正解の言葉を当てはめて表示
                const correctRuby = await formatWordChoiceWithRuby(qData.target);
                const filledBadge = `<span class="inline-block mx-1 px-3 py-0.5 rounded-xl bg-emerald-100 border-2 border-emerald-500 text-emerald-800 font-black shadow-sm">${correctRuby}</span>`;
                const filledQuestionHtml = (await addFuriganaToAllKanji(qData.questionText)).replace(
                    /<span class="blank-box">【　？　】<\/span>/g,
                    filledBadge
                );
                document.getElementById('question-text').innerHTML = filledQuestionHtml;

                document.getElementById('correct-word-display').innerHTML = correctRuby;
                document.getElementById('explanation-meaning').innerHTML = await addFuriganaToAllKanji(qData.target.meaning);

                const exBox = document.getElementById('explanation-example-box');
                const exText = document.getElementById('explanation-example');
                if (qData.target.example) {
                    exBox.classList.remove('hidden');
                    exText.innerHTML = await addFuriganaToAllKanji(`「${qData.target.example}」`);
                } else {
                    exBox.classList.add('hidden');
                }

                const nextBtnText = document.getElementById('next-btn-text');
                if (currentQuestionIndex + 1 >= currentQuizSet.length) {
                    nextBtnText.innerHTML = '👑 <ruby>結果発表<rt>けっかはっぴょう</rt></ruby>をみる';
                } else {
                    nextBtnText.innerHTML = 'つぎの<ruby>問題<rt>もんだい</rt></ruby>へすすむ';
                }
            } catch (err) {
                console.error('Answer handling error:', err);
            } finally {
                const explanationArea = document.getElementById('explanation-area');
                explanationArea.classList.remove('hidden');
                explanationArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function getCelebrationEmoji(score) {
            if (score === 1) return '🎉';
            if (score === 2) return '🎊';
            if (score <= 4) return '🌟';
            if (score <= 7) return '🚀';
            return '👑';
        }

        function getCelebrationTitle(score) {
            if (score === 1) return '大正解！ナイススタート！';
            if (score === 2) return '2問正解！いい調子だね！';
            if (score === 3) return '3問正解！素晴らしいひらめき！';
            if (score === 4) return '4問正解！絶好調だ！！';
            if (score === 5) return '5問正解！すごすぎる大活躍！！';
            if (score <= 7) return `${score}問正解！天才的な語彙力だ！！`;
            if (score <= 9) return `${score}問正解！無敵のクイズマスター！！`;
            return '10問全問正解！！伝説のグランドチャンピオン！！';
        }

        function spawnFloatingEmojis(emojis, count) {
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'floating-emoji text-3xl md:text-5xl';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = (10 + Math.random() * 80) + 'vw';
                el.style.bottom = (10 + Math.random() * 25) + 'vh';
                el.style.animationDelay = (Math.random() * 0.35) + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 2200);
            }
        }

        function triggerEscalatingCelebration(score) {
            playSuccessSound(score);
            const banner = document.getElementById('celebration-banner');
            const bannerTitle = document.getElementById('celebration-title');
            banner.classList.remove('hidden', 'rainbow-border', 'bg-indigo-500', 'bg-pink-500', 'bg-amber-500', 'bg-purple-600');

            try {
                if (score === 1) {
                    banner.classList.add('bg-indigo-500');
                    bannerTitle.innerHTML = `🎉 1<ruby>問正解<rt>もんせいかい</rt></ruby>！ナイススタート！`;
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 50, spread: 65, origin: { y: 0.65 } });
                    }
                } else if (score === 2) {
                    banner.classList.add('bg-pink-500');
                    bannerTitle.innerHTML = `🎊 2<ruby>問正解<rt>もんせいかい</rt></ruby>！どんどん<ruby>盛<rt>も</rt></ruby>り<ruby>上<rt>あ</rt></ruby>がってきたぞ！`;
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 60, angle: 60, spread: 60, origin: { x: 0, y: 0.65 } });
                        confetti({ particleCount: 60, angle: 120, spread: 60, origin: { x: 1, y: 0.65 } });
                    }
                    spawnFloatingEmojis(['🎉', '✨', '🎈'], 6);
                } else if (score === 3) {
                    banner.classList.add('bg-amber-500');
                    bannerTitle.innerHTML = `🌟 3<ruby>問正解<rt>もんせいかい</rt></ruby>！キラキラ<ruby>星<rt>ほし</rt></ruby>のシャワーだ！`;
                    if (typeof confetti === 'function') {
                        confetti({
                            particleCount: 95,
                            spread: 100,
                            origin: { y: 0.4 },
                            shapes: ['star'],
                            colors: ['#FFD700', '#FFA500', '#FF69B4']
                        });
                    }
                    spawnFloatingEmojis(['🌟', '⭐', '💫', '🎉'], 10);
                } else if (score === 4) {
                    banner.classList.add('bg-purple-600');
                    bannerTitle.innerHTML = `🎆 4<ruby>問正解<rt>もんせいかい</rt></ruby>！ド<ruby>迫力<rt>はくりょく</rt></ruby>の4<ruby>連発花火<rt>れんぱつはなび</rt></ruby>！！`;
                    triggerScreenShake();
                    if (typeof confetti === 'function') {
                        for (let i = 0; i < 4; i++) {
                            setTimeout(() => {
                                confetti({
                                    particleCount: 75,
                                    startVelocity: 35,
                                    spread: 360,
                                    origin: { x: 0.2 + i * 0.2, y: 0.35 }
                                });
                            }, i * 180);
                        }
                    }
                    spawnFloatingEmojis(['🎆', '🎇', '🔥', '👏'], 14);
                } else {
                    banner.classList.add('rainbow-border');
                    bannerTitle.innerHTML = `👑 ${score}<ruby>問正解<rt>もんせいかい</rt></ruby>！！<ruby>超豪華<rt>ちょうごうか</rt></ruby>フェスティバル！！🎊`;
                    triggerScreenShake();
                    if (typeof confetti === 'function') {
                        const bursts = Math.min(4 + score, 10);
                        for (let i = 0; i < bursts; i++) {
                            setTimeout(() => {
                                confetti({
                                    particleCount: 60 + score * 4,
                                    spread: 110,
                                    startVelocity: 40,
                                    origin: { x: 0.15 + Math.random() * 0.7, y: 0.25 + Math.random() * 0.4 }
                                });
                            }, i * 150);
                        }
                    }
                    spawnFloatingEmojis(['👑', '🏆', '🎊', '🎉', '🌈', '🚀'], 12 + score * 2);
                }
            } catch (e) {}
        }

        function triggerScreenShake() {
            document.body.classList.remove('shake-screen');
            void document.body.offsetWidth;
            document.body.classList.add('shake-screen');
            setTimeout(() => document.body.classList.remove('shake-screen'), 500);
        }

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSuccessSound(score) {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const baseNotes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                const noteCount = Math.min(2 + score, baseNotes.length);
                for (let i = 0; i < noteCount; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = score >= 4 ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(baseNotes[i], now + i * 0.08);
                    gain.gain.setValueAtTime(0.16, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.35);
                }
            } catch (e) {}
        }

        function playWrongSound() {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                [220, 196].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.16);
                    gain.gain.setValueAtTime(0.1, now + idx * 0.16);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.16 + 0.24);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.16);
                    osc.stop(now + idx * 0.16 + 0.24);
                });
            } catch (e) {}
        }

        document.getElementById('next-btn').addEventListener('click', async () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuizSet.length) {
                await renderCurrentQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                await showFinalScreen();
            }
        });

        async function showFinalScreen() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('celebration-banner').classList.add('hidden');
            const finalScreen = document.getElementById('final-screen');
            finalScreen.classList.remove('hidden');

            const totalQ = currentQuizSet.length || QUESTIONS_PER_ROUND;
            document.getElementById('final-score').textContent = currentScore;
            document.getElementById('final-max').textContent = totalQ;

            let msg = '';
            if (currentScore === totalQ) {
                document.getElementById('final-emoji').textContent = '👑';
                msg = '全問正解パーフェクト達成！！すべての問題を見事にクリアしました！';
            } else if (currentScore >= 7) {
                document.getElementById('final-emoji').textContent = '🏆';
                msg = 'すばらしい大活躍でした！この調子でどんどん言葉をマスターしよう！';
            } else {
                document.getElementById('final-emoji').textContent = '🌱';
                msg = '最後までよくがんばりました！もう一度チャレンジして記録をのばそう！';
            }
            document.getElementById('final-message').innerHTML = await addFuriganaToAllKanji(msg);

            if (currentScore > 0) triggerEscalatingCelebration(Math.max(currentScore, 3));
        }

        document.getElementById('retry-btn').addEventListener('click', async () => {
            await startNewRound();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('replay-celebration-btn').addEventListener('click', () => {
            triggerEscalatingCelebration(Math.max(currentScore, 6));
        });

        // アプリ起動
        initApp();
    </script>
</body>
</html>
