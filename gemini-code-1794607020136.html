<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わくわく3択穴埋めクイズ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- お祝い紙吹雪ライブラリ (Canvas Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- ふりがな生成ライブラリ (非同期・バックグラウンド補助用) -->
    <script src="https://cdn.jsdelivr.net/npm/kuroshiro@1.2.0/dist/kuroshiro.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js" defer></script>
    <style>
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Yu Gothic', 'Meiryo', sans-serif;
            user-select: none;
        }
        ruby {
            ruby-align: center;
        }
        rt {
            font-size: 0.6em;
            color: #4b5563;
            font-weight: normal;
        }
        .choice-btn rt {
            color: inherit;
            opacity: 0.85;
        }
        .blank-box {
            display: inline-block;
            background-color: #fef08a;
            color: #d97706;
            border: 2px dashed #f59e0b;
            border-radius: 0.5rem;
            padding: 0.05rem 0.5rem;
            margin: 0 0.2rem;
            font-weight: 900;
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes screenShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px) rotate(-0.5deg); }
            40%, 80% { transform: translateX(6px) rotate(0.5deg); }
        }
        .shake-effect {
            animation: screenShake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-50 to-indigo-100 text-gray-800 min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <!-- 1. ローディング画面 -->

        <h1 class="text-2xl font-bold text-blue-600 mb-3">
            <ruby>問題<rt>もんだい</rt></ruby>を<ruby>読<rt>よ</rt></ruby>み<ruby>込<rt>こ</rt></ruby>んでいます...
        </h1>

        </p>
        <div class="w-full bg-gray-200 rounded-full h-3 mb-4 overflow-hidden">
            <div id="loading-bar" class="bg-blue-500 h-3 rounded-full transition-all duration-300" style="width: 30%"></div>
        </div>
        <div id="loading-error" class="hidden bg-red-50 border border-red-200 text-red-600 p-4 rounded-xl text-left text-sm mt-4"></div>
    </div>

            <h1 class="text-xl md:text-2xl font-extrabold text-blue-600">
                わくわく3<ruby>択<rt>たく</rt></ruby><ruby>穴埋<rt>あなう</rt></ruby>めクイズ
            </h1>
            <div class="flex items-center gap-3">
                <span class="text-xs bg-blue-100 text-blue-700 font-bold px-3 py-1 rounded-full">
                    <ruby>全<rt>ぜん</rt></ruby><span id="total-pool-count">0</span><ruby>語<rt>ご</rt></ruby><ruby>収録<rt>しゅうろく</rt></ruby>
                </span>
                <div class="bg-orange-100 text-orange-600 font-extrabold px-4 py-1.5 rounded-full text-base md:text-lg shadow-sm">
                    🔥 <span id="score-display">0</span><ruby>問<rt>もん</rt></ruby><ruby>正解<rt>せいかい</rt></ruby>！
                </div>
            </div>
        </div>

        <!-- 進捗バーと問題番号 -->
        <div class="flex justify-between items-center mb-2 text-sm font-bold text-gray-500">
            <div>だい <span id="current-q-num" class="text-blue-600 text-lg">1</span> もん / <span id="max-q-num">10</span></div>
            <div><ruby>未出題<rt>みしゅつだい</rt></ruby>プール: <span id="remaining-pool-count">0</span><ruby>問<rt>もん</rt></ruby></div>
        </div>
        <div class="w-full bg-gray-100 rounded-full h-2.5 mb-6">
            <div id="quiz-progress-bar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
        </div>

        <!-- 問題文エリア -->
        <div id="question-box" class="text-lg md:text-2xl font-bold leading-loose mb-8 bg-blue-50/80 p-6 rounded-2xl border-2 border-blue-200 shadow-inner">

            <p id="question-text" class="text-gray-800 leading-loose"></p>
        </div>

        <!-- 3択ボタンエリア -->
        <div id="choices-container" class="flex flex-col gap-4"></div>

        <!-- 解答・解説表示エリア（選択後に表示） -->
        <div id="explanation-area" class="hidden mt-8 pt-6 border-t-2 border-dashed border-gray-200 text-center animate-pop">
            <div class="flex items-center justify-center gap-3 mb-4">
                <span id="result-icon" class="text-4xl md:text-5xl"></span>
                <h2 id="result-title" class="text-2xl md:text-3xl font-extrabold"></h2>
            </div>

            <div class="bg-amber-50 border-2 border-amber-200 p-5 rounded-2xl text-left mb-6 shadow-sm">
                <p class="font-bold text-base md:text-lg mb-3 text-gray-700">

                <div class="bg-white p-4 rounded-xl border border-amber-100 space-y-3">

                    </div>
                    <div id="explanation-example-box" class="pt-3 border-t border-gray-100 hidden">

                        <p id="explanation-example" class="text-base md:text-lg text-gray-700 leading-loose"></p>
                    </div>
                </div>
