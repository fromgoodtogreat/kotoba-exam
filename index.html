<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わくわく3択穴埋めクイズ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Yu Gothic', 'Meiryo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        button {
            touch-action: manipulation;
        }
        ruby {
            ruby-align: center;
        }
        rt {
            font-size: 0.62em;
            color: #4b5563;
            font-weight: bold;
        }
        .choice-btn rt {
            color: #4338ca;
            opacity: 0.9;
        }
        .blank-box {
            display: inline-block;
            background-color: #fef08a;
            color: #d97706;
            border: 2px dashed #f59e0b;
            border-radius: 0.5rem;
            padding: 0.05rem 0.5rem;
            margin: 0 0.2rem;
            font-weight: 900;
        }
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.2s ease-out forwards;
        }
        @keyframes screenShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px) rotate(-0.5deg); }
            40%, 80% { transform: translateX(6px) rotate(0.5deg); }
        }
        .shake-effect {
            animation: screenShake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-50 to-indigo-100 text-slate-800 min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <!-- 1. ローディング画面 -->
    <div id="loading-screen" class="w-full max-w-2xl bg-white rounded-3xl shadow-xl p-8 text-center">
        <div class="animate-bounce text-5xl mb-4">📚</div>
        <h1 class="text-2xl font-bold text-indigo-600 mb-3">
            <ruby>問題<rt>もんだい</rt></ruby>を<ruby>読<rt>よ</rt></ruby>み<ruby>込<rt>こ</rt></ruby>んでいます...
        </h1>
        <p id="loading-status" class="text-slate-600 mb-4 font-bold">
            プログラムを<ruby>起動<rt>きどう</rt></ruby>しています...
        </p>
        <div class="w-full bg-slate-200 rounded-full h-3 mb-4 overflow-hidden">
            <div id="loading-bar" class="bg-indigo-500 h-3 rounded-full transition-all duration-300" style="width: 15%"></div>
        </div>
        <div id="loading-error" class="hidden bg-rose-50 border-2 border-rose-300 text-rose-700 p-4 rounded-xl text-left text-sm mt-4 space-y-2"></div>
    </div>

    <!-- 2. メインのクイズ画面 -->
    <div id="quiz-screen" class="w-full max-w-2xl bg-white rounded-3xl shadow-xl p-6 md:p-8 hidden">
        <!-- ヘッダー -->
        <div class="flex flex-wrap justify-between items-center gap-2 mb-6 border-b-2 border-indigo-100 pb-4">
            <h1 class="text-xl md:text-2xl font-extrabold text-indigo-600">
                わくわく3<ruby>択<rt>たく</rt></ruby><ruby>穴埋<rt>あなう</rt></ruby>めクイズ
            </h1>
            <div class="flex items-center gap-3">
                <span class="text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full">
                    <ruby>全<rt>ぜん</rt></ruby><span id="total-pool-count">0</span><ruby>語<rt>ご</rt></ruby><ruby>収録<rt>しゅうろく</rt></ruby>
                </span>
                <div class="bg-orange-100 text-orange-600 font-extrabold px-4 py-1.5 rounded-full text-base md:text-lg shadow-sm">
                    🔥 <span id="score-display">0</span><ruby>問<rt>もん</rt></ruby><ruby>正解<rt>せいかい</rt></ruby>！
                </div>
            </div>
        </div>

        <!-- 進捗バー -->
        <div class="flex justify-between items-center mb-2 text-sm font-bold text-slate-500">
            <div>だい <span id="current-q-num" class="text-indigo-600 text-lg">1</span> もん / <span id="max-q-num">10</span></div>
            <div><ruby>未出題<rt>みしゅつだい</rt></ruby>プール: <span id="remaining-pool-count">0</span><ruby>問<rt>もん</rt></ruby></div>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2.5 mb-6 overflow-hidden">
            <div id="quiz-progress-bar" class="bg-indigo-500 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
        </div>

        <!-- 問題文ボックス -->
        <div id="question-box" class="text-lg md:text-2xl font-bold leading-loose mb-8 bg-indigo-50/70 p-6 rounded-2xl border-2 border-indigo-200 shadow-inner">
            <div id="question-type-badge" class="inline-block text-xs font-bold bg-indigo-600 text-white px-3 py-1 rounded-lg mb-3"></div>
            <p id="question-text" class="text-slate-800 leading-[2.3]"></p>
        </div>

        <!-- 3択ボタンコンテナ -->
        <div id="choices-container" class="flex flex-col gap-4"></div>

        <!-- 解説・次へエリア -->
        <div id="explanation-area" class="hidden mt-8 pt-6 border-t-2 border-dashed border-slate-200 animate-pop">
            <div id="feedback-box" class="rounded-2xl p-5 mb-6 flex items-start gap-4 border-2 bg-emerald-50/90 border-emerald-300">
                <span id="result-icon" class="text-4xl md:text-5xl shrink-0">🎉</span>
                <div class="text-left flex-1">
                    <h2 id="result-title" class="text-xl md:text-2xl font-black mb-1 text-emerald-700"></h2>
                    <p class="font-bold text-base md:text-lg text-slate-700 mt-2">
                        【<ruby>正解<rt>せいかい</rt></ruby>】
                        <span id="correct-word-display" class="text-2xl md:text-3xl font-extrabold text-rose-600 ml-1 leading-relaxed"></span>
                    </p>
                    <p id="dict-form-note" class="text-xs md:text-sm text-slate-500 font-bold mt-1 hidden"></p>
                </div>
            </div>

            <div class="bg-amber-50/90 border-2 border-amber-200 p-5 rounded-2xl text-left mb-6 shadow-sm space-y-3">
                <div>
                    <p class="font-bold text-sm text-indigo-600 mb-1">■ <ruby>意味<rt>いみ</rt></ruby>・<ruby>解説<rt>かいせつ</rt></ruby>：</p>
                    <p id="explanation-meaning" class="text-base md:text-lg text-slate-800 leading-[2.1] font-bold"></p>
                </div>
                <div id="explanation-example-box" class="pt-3 border-t border-amber-200/70 hidden">
                    <p class="font-bold text-sm text-emerald-700 mb-1">■ <ruby>例文<rt>れいぶん</rt></ruby>：</p>
                    <p id="explanation-example" class="text-base md:text-lg text-slate-700 leading-[2.1]"></p>
                </div>
            </div>

            <button id="next-btn" type="button" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-extrabold py-4 px-8 rounded-2xl text-xl shadow-lg transition transform hover:-translate-y-0.5 cursor-pointer flex items-center justify-center gap-2">
                <span id="next-btn-text">つぎの<ruby>問題<rt>もんだい</rt></ruby>へすすむ</span> ➡️
            </button>
        </div>
    </div>

    <!-- 3. 最終結果画面 -->
    <div id="final-screen" class="w-full max-w-2xl bg-white rounded-3xl shadow-xl p-8 text-center hidden animate-pop">
        <div id="final-emoji" class="text-6xl mb-4">👑</div>
        <h2 class="text-3xl font-extrabold text-indigo-600 mb-2">
            クイズ<ruby>終了<rt>しゅうりょう</rt></ruby>！！
        </h2>
        <p id="final-message" class="text-lg text-slate-600 font-bold mb-6 leading-relaxed"></p>

        <div class="bg-gradient-to-r from-amber-50 to-orange-50 border-2 border-orange-200 rounded-2xl p-6 mb-8">
            <p class="text-sm font-bold text-slate-500 mb-1">あなたの<ruby>最終<rt>さいしゅう</rt></ruby>スコア</p>
            <p class="text-4xl md:text-5xl font-black text-orange-500">
                <span id="final-score">0</span> / <span id="final-max">10</span> <ruby>問<rt>もん</rt></ruby><ruby>正解<rt>せいかい</rt></ruby>！
            </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button id="retry-btn" type="button" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-4 px-6 rounded-2xl text-lg shadow-lg transition transform hover:-translate-y-0.5 cursor-pointer">
                🔄 もういちど<ruby>新<rt>あたら</rt></ruby>しい10<ruby>問<rt>もん</rt></ruby>であそぶ
            </button>
            <button id="replay-celebration-btn" type="button" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold py-4 px-6 rounded-2xl text-lg shadow-lg transition transform hover:-translate-y-0.5 cursor-pointer">
                🎊 <ruby>花火<rt>はなび</rt></ruby>をもういちど<ruby>上<rt>あ</rt></ruby>げる
            </button>
        </div>
    </div>

    <!-- プレビュー環境用の内蔵サンプルデータ -->

    [
        {"word":"踵（きびす）を返す","meaning":"来た道を戻ること。引き返す。","example":"「彼は踵を返して去っていった」"},

                    } catch (fetchErr) {}
                }

                if (!rawText) {
                    rawText = document.getElementById('fallback-json-data').textContent;
                }

                statusEl.textContent = '問題データとふりがな辞書を準備しています...';
                barEl.style.width = '85%';

                const cleanJsonText = rawText.replace(/^\uFEFF/, '').trim();
                const rawJson = JSON.parse(cleanJsonText);

                fastLoadWordsJson(rawJson);

                if (allWordsPool.length < 4) {
                    throw new Error(`有効な問題データが ${allWordsPool.length} 件しかありません。`);
                }

                rebuildSortedDictKeys();
                barEl.style.width = '100%';

                document.getElementById('total-pool-count').textContent = allWordsPool.length;
                resetUnusedPool();
                startNewRound();

            } catch (err) {
                console.error(err);
                errorEl.classList.remove('hidden');
                errorEl.innerHTML = `<div><strong>読み込みエラー:</strong><br>${err.message}</div>`;
            }
        }

        function rebuildSortedDictKeys() {
            sortedDictKeys = Array.from(customRubyDict.keys())
                .filter(k => k && /[一-龠々〆ヵヶ]/.test(k))
                .sort((a, b) => b.length - a.length);
        }

        // JSON読み込み時に、全2,283件の括弧内ふりがなも一気に辞書登録する（約15msで完了）
        function fastLoadWordsJson(rawData) {
            const list = Array.isArray(rawData) ? rawData : [];
            allWordsPool = [];

            for (let idx = 0; idx < list.length; idx++) {
                const item = list[idx];
                if (!item || typeof item !== 'object') continue;
                const rawWord = String(item.word || '').trim();
                const rawMeaning = String(item.meaning || '').trim();
                const rawExample = String(item.example || '').trim();

                if (!rawWord || !rawMeaning) continue;
                if (rawWord === '語彙' && rawMeaning === '意味') continue;

                // JSONのwordやmeaningに含まれる括弧ふりがなをグローバル辞書に登録
                preRegisterReadingsFromRawWord(rawWord);
                extractInlineReadingsFromText(rawMeaning);

                const cleanWord = rawWord.replace(/[（\(].*?[）\)]/g, '').replace(/。+$/, '').trim();

                allWordsPool.push({
                    id: idx,
                    rawWord: rawWord,
                    cleanWord: cleanWord,
                    wordCategory: classifyWordType(cleanWord),
                    rawMeaning: rawMeaning,
                    rawExample: rawExample,
                    parsed: false
                });
            }
        }

        // 単語の品詞・活用タイプを分類（ダミー選択肢も同じ活用タイプから選ぶため）
        function classifyWordType(cleanWord) {
            if (cleanWord.endsWith('する')) return 'suru_verb';
            if (cleanWord.endsWith('だ')) return 'da_adj';
            if (cleanWord.endsWith('な')) return 'na_adj';
            if (cleanWord.endsWith('い') && cleanWord.length >= 3 && /[ぁ-ん]い$/.test(cleanWord)) return 'i_adj';
            if (/[うくぐすつぬぶむる]$/.test(cleanWord) && /[一-龠々〆ヵヶ]/.test(cleanWord)) return 'verb';
            return 'noun';
        }

        // JSON内の "怪訝（けげん）だ"、"閉口する（へいこうする）"、"角を矯めて牛を殺す（つのをためてうしをころす）" 等から漢字の読みを抽出
        function preRegisterReadingsFromRawWord(rawWord) {
            if (!rawWord.includes('（') && !rawWord.includes('(')) return;

            // 1. 直前の漢字に対する括弧読み 例: 怪訝（けげん）だ / 踵（きびす）を返す
            const inlineRegex = /([一-龠々〆ヵヶ]+)[（\(]([ぁ-んァ-ヶー]+)[）\)]/g;
            let m;
            while ((m = inlineRegex.exec(rawWord)) !== null) {
                const k = m[1];
                const r = katakanaToHiragana(m[2]);
                customRubyDict.set(k, r);
            }

            // 2. 単語末尾に全体の読みが括弧で付いている場合 例: 閉口する（へいこうする） / 竹馬の友（ちくばのとも）
            const tailMatch = rawWord.match(/^([^（\(]+)[（\(]([ぁ-んァ-ヶー]+)[）\)]([^（\(]*)$/);
            if (tailMatch) {
                const basePart = tailMatch[1].trim();
                const fullReading = katakanaToHiragana(tailMatch[2].trim());
                alignKanjiAndReading(basePart, fullReading);
            }
        }

        // 漢字混じり語句（例：「竹馬の友」「閉口する」）とひらがな読み（例：「ちくばのとも」「へいこうする」）から漢字部分の読みを自動切り出し
        function alignKanjiAndReading(surface, reading) {
            if (!surface || !reading) return;
            // 完全漢字のみの場合
            if (/^[一-龠々〆ヵヶ]+$/.test(surface)) {
                customRubyDict.set(surface, reading);
                return;
            }
            // 「漢字＋送り仮名」の場合（例：閉口する -> へいこうする）
            const m1 = surface.match(/^([一-龠々〆ヵヶ]+)([ぁ-ん]+)$/);
            if (m1 && reading.endsWith(m1[2]) && reading.length > m1[2].length) {
                customRubyDict.set(m1[1], reading.slice(0, reading.length - m1[2].length));
                return;
            }
            // ひらがなをアンカーにした正規表現で各漢字ブロックの読みを抽出（例：「角を矯めて牛を殺す」＋「つのをためてうしをころす」）
            const tokens = surface.match(/[一-龠々〆ヵヶ]+|[^一-龠々〆ヵヶ]+/g);
            if (!tokens) return;
            let regexStr = '^';
            const kanjiTokens = [];
            tokens.forEach(tk => {
                if (/^[一-龠々〆ヵヶ]+$/.test(tk)) {
                    kanjiTokens.push(tk);
                    regexStr += '([ぁ-んー]+?)';
                } else {
                    regexStr += escapeRegExp(katakanaToHiragana(tk));
                }
            });
            regexStr += '$';
            try {
                const match = reading.match(new RegExp(regexStr));
                if (match) {
                    kanjiTokens.forEach((kt, i) => {
                        if (match[i + 1]) customRubyDict.set(kt, match[i + 1]);
                    });
                }
            } catch (e) {}
        }

        function ensureItemParsed(item) {
            if (item.parsed) return item;

            const parsed = parseWordAndParentheses(item.rawWord);
            extractInlineReadingsFromText(item.rawMeaning);
            extractInlineReadingsFromText(item.rawExample);

            item.preRubyHtml = parsed.preRubyHtml;
            item.extractedReadings = parsed.readings;
            item.altForms = parsed.altForms;
            item.meaning = item.rawMeaning.replace(/[（\(]([ぁ-んァ-ヶー]+)[）\)]/g, '');
            item.example = item.rawExample.replace(/^「+/, '').replace(/」+$/, '').replace(/[（\(]([ぁ-んァ-ヶー]+)[）\)]/g, '').trim();
            item.parsed = true;

            return item;
        }

        function extractInlineReadingsFromText(text) {
            if (!text || (!text.includes('（') && !text.includes('('))) return;
            const regex = /([一-龠々〆ヵヶ]+)[（\(]([ぁ-んァ-ヶー]+)[）\)]/g;
            let m;
            while ((m = regex.exec(text)) !== null) {
                if (m[1] && m[2]) {
                    customRubyDict.set(m[1], katakanaToHiragana(m[2]));
                }
            }
        }

        function parseWordAndParentheses(rawWord) {
            let cleanWord = rawWord;
            let preRubyHtml = rawWord;
            const readings = [];
            const altForms = [];

            // 直前の漢字に対する括弧読みを <ruby> に変換
            preRubyHtml = preRubyHtml.replace(/([一-龠々〆ヵヶ]+)[（\(]([ぁ-んァ-ヶー・]+)[）\)]/g, (match, kanji, reading) => {
                const hira = katakanaToHiragana(reading);
                readings.push(hira);
                customRubyDict.set(kanji, hira);
                return `<ruby>${kanji}<rt>${hira}</rt></ruby>`;
            });

            // 末尾等に括弧が残っている場合の処理
            const parenRegex = /[（\(](.*?)[）\)]/g;
            let m;
            while ((m = parenRegex.exec(rawWord)) !== null) {
                const content = m[1].trim();
                if (/^[ぁ-んァ-ヶー]+$/.test(content)) {
                    const hira = katakanaToHiragana(content);
                    if (!readings.includes(hira)) readings.push(hira);
                } else if (content) {
                    altForms.push(content);
                }
            }

            cleanWord = rawWord.replace(/[（\(].*?[）\)]/g, '').replace(/。+$/, '').trim();
            preRubyHtml = preRubyHtml.replace(/[（\(].*?[）\)]/g, '').replace(/。+$/, '').trim();

            if (readings.length >= 1) {
                alignKanjiAndReading(cleanWord, readings[0]);
            }

            return { cleanWord, preRubyHtml, readings, altForms };
        }

        function katakanaToHiragana(str) {
            return str.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
        }

        function hiraganaToKatakana(str) {
            return str.replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60));
        }

        function applyBuiltinRubyToPlainSegment(segment) {
            if (!segment || !/[一-龠々〆ヵヶ]/.test(segment)) return segment;
            let work = segment;
            const replacements = [];

            for (let i = 0; i < sortedDictKeys.length; i++) {
                const key = sortedDictKeys[i];
                if (work.includes(key)) {
                    const reading = customRubyDict.get(key);
                    if (reading) {
                        const token = `\uE000${replacements.length}\uE001`;
                        replacements.push(`<ruby>${key}<rt>${reading}</rt></ruby>`);
                        work = work.split(key).join(token);
                        if (!/[一-龠々〆ヵヶ]/.test(work)) break;
                    }
                }
            }
            return work.replace(/\uE000(\d+)\uE001/g, (_, idx) => replacements[Number(idx)]);
        }

        function addFuriganaToAllKanji(text) {
            if (!text) return '';
            const BLANK_TOKEN = '___QUIZ_BLANK_BOX___';
            let workText = String(text);

            workText = workText.replace(/([一-龠々〆ヵヶ]+)[（\(]([ぁ-んァ-ヶー]+)[）\)]/g, (_, k, r) => {
                const hira = katakanaToHiragana(r);
                customRubyDict.set(k, hira);
                return `<ruby>${k}<rt>${hira}</rt></ruby>`;
            });

            workText = workText.replace(/【\s*[？\?]\s*】/g, BLANK_TOKEN);

            const parts = workText.split(/(<ruby>.*?<\/ruby>|<[^>]+>)/g);
            workText = parts.map(part => part.startsWith('<') ? part : applyBuiltinRubyToPlainSegment(part)).join('');

            return workText.replace(new RegExp(BLANK_TOKEN, 'g'), '<span class="blank-box">【　？　】</span>');
        }

        // 選択肢のテキスト（活用形に変換された文字列も含む）に確実にふりがなを振る
        function formatChoiceStringWithRuby(choiceStr, wordObj) {
            ensureItemParsed(wordObj);
            if (!/[一-龠々〆ヵヶ]/.test(choiceStr)) return choiceStr;

            // もとの単語のpreRubyHtmlと先頭が一致する場合は、その<ruby>構造を活かしつつ残りの漢字にもルビを振る
            if (choiceStr === wordObj.cleanWord && wordObj.preRubyHtml) {
                return addFuriganaToAllKanji(wordObj.preRubyHtml);
            }
            return addFuriganaToAllKanji(choiceStr);
        }

        function getHiraganaReadingSync(text) {
            if (!text) return '';
            if (/^[ぁ-んァ-ヶー]+$/.test(text)) return katakanaToHiragana(text);
            if (customRubyDict.has(text)) return customRubyDict.get(text);
            return '';
        }

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // ==========================================
        // 助詞を巻き込まずに正解箇所だけを特定し、実際の活用形（matchedSurface）も返す関数
        // ==========================================
        function maskAndExtractConjugation(sentence, wordObj) {
            if (!sentence) return { masked: '', matchedSurface: null, conjType: null };
            ensureItemParsed(wordObj);

            let masked = sentence;
            let matchedSurface = null;
            let conjType = null;

            const baseClean = wordObj.cleanWord.replace(/^[〜～・]+/, '').trim();
            const candidates = new Set([baseClean, ...(wordObj.altForms || [])]);
            baseClean.split('・').forEach(p => { if (p.trim()) candidates.add(p.trim()); });
            if (baseClean.includes('、')) candidates.add(baseClean.replace(/、/g, ''));

            // 特定の語に対する有効な活用形リストを生成（に・を・は・が等の格助詞は絶対に含めない！）
            const validForms = [];

            for (const cand of candidates) {
                if (!cand) continue;
                validForms.push({ form: cand, type: 'exact' });

                // (A) 「〜する」で終わる言葉（例：閉口する → 閉口した / 閉口して / 閉口）
                if (cand.endsWith('する') && cand.length > 2) {
                    const stem = cand.slice(0, -2);
                    ['する', 'した', 'して', 'しない', 'しなかった', 'せず', 'しろ', 'すれば', 'しよう', 'される', 'された', 'させる', 'させた', 'し'].forEach(suf => {
                        validForms.push({ form: stem + suf, type: 'suru:' + suf });
                    });
                    validForms.push({ form: stem, type: 'suru_stem' });
                }
                // (B) 「〜だ」で終わる形容動詞（例：怪訝だ → 怪訝な / 怪訝に / 怪訝）
                else if (cand.endsWith('だ') && cand.length > 1) {
                    const stem = cand.slice(0, -1);
                    ['だ', 'な', 'に', 'だった', 'なら', 'で'].forEach(suf => {
                        validForms.push({ form: stem + suf, type: 'da:' + suf });
                    });
                    validForms.push({ form: stem, type: 'da_stem' });
                }
                // (C) 「〜な」で終わる連体詞・形容動詞（例：無難な → 無難に / 無難だ / 無難）
                else if (cand.endsWith('な') && cand.length > 1) {
                    const stem = cand.slice(0, -1);
                    ['な', 'に', 'だ', 'だった'].forEach(suf => {
                        validForms.push({ form: stem + suf, type: 'na:' + suf });
                    });
                    validForms.push({ form: stem, type: 'na_stem' });
                }
                // (D) 「〜い」で終わる形容詞・句（例：折り合いが悪い → 折り合いが悪く / 折り合いが悪かった）
                else if (cand.endsWith('い') && cand.length >= 3 && /[ぁ-ん]い$/.test(cand)) {
                    const stem = cand.slice(0, -1);
                    ['い', 'く', 'くて', 'かった', 'くない', 'ければ', 'さ', 'そう'].forEach(suf => {
                        validForms.push({ form: stem + suf, type: 'iadj:' + suf });
                    });
                }
                // (E) 動詞・動詞句（例：踵を返す → 踵を返して / 引き合いに出す → 引き合いに出して / 高をくくる → 高をくくっていたら）
                else if (/[うくぐすつぬぶむる]$/.test(cand) && cand.length >= 2) {
                    const lastChar = cand.slice(-1);
                    const stem = cand.slice(0, -1);
                    const endings = VERB_CONJUGATIONS[lastChar] || [];
                    endings.forEach(suf => {
                        validForms.push({ form: stem + suf, type: 'verb:' + suf });
                    });
                }
            }

            // ひらがな・カタカナ表記の候補も追加
            const hiraReading = (wordObj.extractedReadings && wordObj.extractedReadings[0]) || getHiraganaReadingSync(baseClean);
            if (hiraReading && hiraReading.length >= 3) {
                validForms.push({ form: hiraReading, type: 'kana' });
                validForms.push({ form: hiraganaToKatakana(hiraReading), type: 'kana' });
            }

            // 長い活用形から優先的に検索し、最初に見つかった活用形を記録して【　？　】に置換（後ろの助詞「に」「を」「は」は絶対に消さない）
            validForms.sort((a, b) => b.form.length - a.form.length);

            for (const item of validForms) {
                if (item.form.length >= 2 && masked.includes(item.form)) {
                    if (!matchedSurface) {
                        matchedSurface = item.form;
                        conjType = item.type;
                    }
                    masked = masked.split(item.form).join('【　？　】');
                }
            }

            // もし表記ゆれ（例：「きびすを返して」「目ざとく」など一部かな表記）でまだ【　？　】になっていない場合のスマート検索
            if (!masked.includes('【　？　】')) {
                const particlePhraseMatch = baseClean.match(/^(.+)([をがにへでと])([一-龠々〆ヵヶぁ-ん]+)([うくぐすつぬぶむる])$/);
                if (particlePhraseMatch) {
                    const particle = particlePhraseMatch[2];
                    const vStem = particlePhraseMatch[3];
                    const vEnd = particlePhraseMatch[4];
                    const endings = (VERB_CONJUGATIONS[vEnd] || [vEnd]).slice().sort((a, b) => b.length - a.length);
                    const endPattern = endings.map(escapeRegExp).join('|');
                    const flexRegex = new RegExp(`[一-龠々〆ヵヶぁ-んァ-ヶー]{1,6}${escapeRegExp(particle)}${escapeRegExp(vStem)}(?:${endPattern})`);
                    const m = masked.match(flexRegex);
                    if (m) {
                        matchedSurface = m[0];
                        // どの活用語尾かを特定
                        for (const suf of endings) {
                            if (matchedSurface.endsWith(vStem + suf)) {
                                conjType = 'verb:' + suf;
                                break;
                            }
                        }
                        masked = masked.replace(flexRegex, '【　？　】');
                    }
                }
            }

            // ことわざの前半省略引用（例：「物言えば唇寒し秋の風」→「物言えば唇寒し」）への対応
            if (!masked.includes('【　？　】') && baseClean.length >= 5) {
                const prefix4 = baseClean.slice(0, 4);
                if (masked.includes(prefix4)) {
                    const m = masked.match(new RegExp(escapeRegExp(prefix4) + '[^、。」]*'));
                    if (m) {
                        matchedSurface = m[0];
                        conjType = 'exact';
                        masked = masked.replace(m[0], '【　？　】');
                    }
                }
            }

            masked = masked.replace(/(【\s*[？\?]\s*】)+/g, '【　？　】');
            return { masked, matchedSurface, conjType };
        }

        // ダミー選択肢（誤答）も、問題文の【　？　】の活用形（例：「〜して」「〜した」「〜な」）にピタリと揃える関数
        function inflectDistractorToMatch(distractorItem, conjType, targetCleanWord, targetMatchedSurface) {
            const dWord = distractorItem.cleanWord;
            if (!conjType || conjType === 'exact' || !targetMatchedSurface || targetMatchedSurface === targetCleanWord) {
                return dWord;
            }

            // 1. 「〜する」の活用合わせ
            if (conjType.startsWith('suru:')) {
                const suf = conjType.slice(5);
                if (dWord.endsWith('する')) return dWord.slice(0, -2) + suf;
                if (distractorItem.wordCategory === 'noun' && /^[一-龠々〆ヵヶ]{2,}$/.test(dWord)) return dWord + suf;
            }
            if (conjType === 'suru_stem' && dWord.endsWith('する')) {
                return dWord.slice(0, -2);
            }

            // 2. 「〜だ」「〜な」の活用合わせ
            if (conjType.startsWith('da:') || conjType.startsWith('na:')) {
                const suf = conjType.split(':')[1];
                if (dWord.endsWith('だ') || dWord.endsWith('な')) return dWord.slice(0, -1) + suf;
            }
            if ((conjType === 'da_stem' || conjType === 'na_stem') && (dWord.endsWith('だ') || dWord.endsWith('な'))) {
                return dWord.slice(0, -1);
            }

            // 3. い形容詞の活用合わせ（例：悪く / 悪かった）
            if (conjType.startsWith('iadj:')) {
                const suf = conjType.slice(5);
                if (dWord.endsWith('い') && /[ぁ-ん]い$/.test(dWord)) {
                    return dWord.slice(0, -1) + suf;
                }
            }

            // 4. 動詞・動詞慣用句の活用合わせ（例：踵を返す→踵を返して のとき、胸を借りる→胸を借りて、引き合いに出す→引き合いに出して に変換）
            if (conjType.startsWith('verb:')) {
                const targetSuf = conjType.slice(5);
                if (/[うくぐすつぬぶむる]$/.test(dWord)) {
                    const lastChar = dWord.slice(-1);
                    const stem = dWord.slice(0, -1);
                    return conjugateJapaneseVerb(stem, lastChar, targetSuf);
                }
            }

            return dWord;
        }

        // 日本語の五段・一段動詞を目的の語尾（て形・た形・ない形・連用形など）に活用させる関数
        function conjugateJapaneseVerb(stem, lastChar, targetSuf) {
            // 一段動詞の簡易判定（〜える・〜いる・〜ける・〜せる・〜てる・〜ねる・〜へる・〜める・〜れる 等）
            const isIchidan = (lastChar === 'る') && /[いきぎしじちぢにひびぴみりえけげせぜてでねへべぺめれ]$/.test(stem);

            // て形・ている・ていた
            if (targetSuf.startsWith('って') || targetSuf.startsWith('いて') || targetSuf.startsWith('いで') || targetSuf.startsWith('して') || targetSuf.startsWith('んで') || targetSuf.startsWith('て')) {
                const tailAfterTe = targetSuf.replace(/^(って|いて|いで|して|んで|て)/, '');
                if (isIchidan) return stem + 'て' + tailAfterTe;
                const teMap = { 'う': 'って', 'つ': 'って', 'る': 'って', 'く': 'いて', 'ぐ': 'いで', 'す': 'して', 'ぬ': 'んで', 'ぶ': 'んで', 'む': 'んで' };
                return stem + (teMap[lastChar] || 'て') + tailAfterTe;
            }
            // た形・たり・たら
            if (targetSuf.startsWith('った') || targetSuf.startsWith('いた') || targetSuf.startsWith('いだ') || targetSuf.startsWith('した') || targetSuf.startsWith('んだ') || targetSuf.startsWith('た')) {
                const tailAfterTa = targetSuf.replace(/^(った|いた|いだ|した|んだ|た)/, '');
                if (isIchidan) return stem + 'た' + tailAfterTa;
                const taMap = { 'う': 'った', 'つ': 'った', 'る': 'った', 'く': 'いた', 'ぐ': 'いだ', 'す': 'した', 'ぬ': 'んだ', 'ぶ': 'んだ', 'む': 'んだ' };
                return stem + (taMap[lastChar] || 'た') + tailAfterTa;
            }
            // ない形・なかった・ず
            if (targetSuf.includes('ない') || targetSuf.includes('なかった') || targetSuf.endsWith('ず')) {
                const negTail = targetSuf.replace(/^[わかがさたなばまら]/, '');
                if (isIchidan) return stem + negTail;
                const aMap = { 'う': 'わ', 'く': 'か', 'ぐ': 'が', 'す': 'さ', 'つ': 'た', 'ぬ': 'な', 'ぶ': 'ば', 'む': 'ま', 'る': 'ら' };
                return stem + (aMap[lastChar] || '') + negTail;
            }
            // ます形・連用形
            if (targetSuf.includes('ます') || targetSuf.includes('ました') || targetSuf.length === 1) {
                const iMap = { 'う': 'い', 'く': 'き', 'ぐ': 'ぎ', 'す': 'し', 'つ': 'ち', 'ぬ': 'に', 'ぶ': 'び', 'む': 'み', 'る': 'り' };
                const baseRenyo = isIchidan ? stem : (stem + (iMap[lastChar] || ''));
                if (targetSuf.length === 1) return baseRenyo;
                const masuTail = targetSuf.replace(/^[いきぎしちにびみり]/, '');
                return baseRenyo + masuTail;
            }

            return stem + lastChar;
        }

        function buildQuizQuestion(targetItem, allPool) {
            ensureItemParsed(targetItem);

            // 例文と意味のマスク＆活用形抽出を先に行う
            const cleanMeaningResult = maskAndExtractConjugation(targetItem.meaning, targetItem);
            const cleanMeaning = cleanMeaningResult.masked.replace(/。$/, '');

            let questionText = '';
            let badgeText = '';
            let activeConjType = 'exact';
            let targetChoiceDisplayWord = targetItem.cleanWord;

            const hasExample = targetItem.example && targetItem.example.length >= 3;

            if (hasExample) {
                const exResult = maskAndExtractConjugation(targetItem.example, targetItem);
                if (exResult.masked.includes('【　？　】')) {
                    badgeText = '📝 例文あなうめクイズ';
                    questionText = `つぎの文の【　？　】に入る言葉をえらぼう！<br>『${exResult.masked}』<br><span class="text-base md:text-lg text-indigo-700 font-bold mt-2 inline-block">（ヒント：${cleanMeaning}）</span>`;
                    // 問題文の【　？　】と選択肢の文字列が完全に一致するように、文中で使われた活用形を選択肢にする
                    if (exResult.matchedSurface) {
                        targetChoiceDisplayWord = exResult.matchedSurface;
                        activeConjType = exResult.conjType;
                    }
                } else {
                    const situation = FUN_SITUATIONS[Math.floor(Math.random() * FUN_SITUATIONS.length)];
                    badgeText = '🌟 ことばの意味・使い方クイズ';
                    questionText = `${situation}<br>「${cleanMeaning}」という意味を持つ【　？　】に入る言葉はどれかな？<br><span class="text-base md:text-lg text-slate-600 mt-1 inline-block">（似た場面の例：『${exResult.masked}』）</span>`;
                }
            } else {
                const situation = FUN_SITUATIONS[Math.floor(Math.random() * FUN_SITUATIONS.length)];
                badgeText = '💡 ことばの意味クイズ';
                questionText = `${situation}<br>「${cleanMeaning}」という意味を表す【　？　】に入る言葉は、つぎの3つのうちどれかな？`;
            }

            // ダミー選択肢を2つ選ぶ（同じ品詞タイプを優先して選び、語尾の活用形を完全に一致させる）
            const distractors = [];
            let attempts = 0;
            while (distractors.length < 2 && attempts < 250) {
                attempts++;
                const candidate = allPool[Math.floor(Math.random() * allPool.length)];
                // 最初の150回は同じ品詞カテゴリ（動詞同士・形容詞同士など）に限定して探す
                if (attempts < 150 && candidate.wordCategory !== targetItem.wordCategory) continue;

                if (
                    candidate.cleanWord !== targetItem.cleanWord &&
                    candidate.rawMeaning !== targetItem.rawMeaning &&
                    !distractors.some(d => d.item.cleanWord === candidate.cleanWord)
                ) {
                    ensureItemParsed(candidate);
                    const inflectedText = inflectDistractorToMatch(
                        candidate,
                        activeConjType,
                        targetItem.cleanWord,
                        targetChoiceDisplayWord
                    );
                    distractors.push({
                        item: candidate,
                        displayWord: inflectedText
                    });
                }
            }

            rebuildSortedDictKeys();

            const choices = [
                { item: targetItem, displayWord: targetChoiceDisplayWord },
                ...distractors
            ];
            shuffleArray(choices);

            // ダミー選択肢が問題文中に偶然入っていないかチェック
            for (const c of choices) {
                if (c.item.cleanWord === targetItem.cleanWord) continue;
                if (c.item.cleanWord.length >= 2 && questionText.includes(c.item.cleanWord)) {
                    questionText = questionText.replace(new RegExp(escapeRegExp(c.item.cleanWord), 'g'), '〇〇');
                }
            }

            return {
                target: targetItem,
                targetDisplayWord: targetChoiceDisplayWord,
                choices: choices,
                questionText: questionText,
                badgeText: badgeText
            };
        }

        function resetUnusedPool() {
            unusedIndices = Array.from({ length: allWordsPool.length }, (_, i) => i);
            shuffleArray(unusedIndices);
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function startNewRound() {
            const roundCount = Math.min(QUESTIONS_PER_ROUND, allWordsPool.length);
            if (unusedIndices.length < roundCount) resetUnusedPool();

            const selectedIndices = unusedIndices.splice(0, roundCount);
            currentQuizSet = selectedIndices.map(idx => buildQuizQuestion(allWordsPool[idx], allWordsPool));
            currentQuestionIndex = 0;
            currentScore = 0;

            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('final-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            updateHeaderStats();
            renderCurrentQuestion();
        }

        function updateHeaderStats() {
            const totalQ = currentQuizSet.length || QUESTIONS_PER_ROUND;
            document.getElementById('score-display').textContent = currentScore;
            document.getElementById('current-q-num').textContent = currentQuestionIndex + 1;
            document.getElementById('max-q-num').textContent = totalQ;
            document.getElementById('remaining-pool-count').textContent = unusedIndices.length;
            const progressPercent = ((currentQuestionIndex + 1) / totalQ) * 100;
            document.getElementById('quiz-progress-bar').style.width = `${progressPercent}%`;
        }

        function renderCurrentQuestion() {
            isQuestionAnswered = false;
            const qData = currentQuizSet[currentQuestionIndex];
            const explanationArea = document.getElementById('explanation-area');
            const choicesContainer = document.getElementById('choices-container');

            explanationArea.classList.add('hidden');
            choicesContainer.innerHTML = '';
            updateHeaderStats();

            document.getElementById('question-type-badge').innerHTML = addFuriganaToAllKanji(qData.badgeText);
            document.getElementById('question-text').innerHTML = addFuriganaToAllKanji(qData.questionText);

            const labels = ['①', '②', '③'];
            for (let i = 0; i < qData.choices.length; i++) {
                const choiceEntry = qData.choices[i];
                const rubyWordHtml = formatChoiceStringWithRuby(choiceEntry.displayWord, choiceEntry.item);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'choice-btn w-full text-left p-4 md:p-5 rounded-2xl border-2 border-slate-200 bg-white hover:border-indigo-400 hover:bg-indigo-50/60 active:scale-[0.99] font-black text-xl md:text-2xl text-slate-800 shadow-sm transition flex items-center gap-4 group cursor-pointer';
                btn.innerHTML = `
                    <span class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-700 group-hover:bg-indigo-600 group-hover:text-white flex items-center justify-center text-lg font-black shrink-0 transition pointer-events-none">${labels[i]}</span>
                    <span class="choice-word-text flex-1 leading-[2.2] pointer-events-none">${rubyWordHtml}</span>
                `;
                btn.addEventListener('click', () => handleChoiceSelect(i));
                choicesContainer.appendChild(btn);
            }
        }

        function handleChoiceSelect(selectedIndex) {
            if (isQuestionAnswered) return;
            isQuestionAnswered = true;

            try {
                const qData = currentQuizSet[currentQuestionIndex];
                const selectedEntry = qData.choices[selectedIndex];
                const isCorrect = (selectedEntry.item.id === qData.target.id);

                const allButtons = document.querySelectorAll('#choices-container .choice-btn');
                allButtons.forEach((btn, idx) => {
                    btn.disabled = true;
                    btn.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50/60', 'cursor-pointer');
                    const entry = qData.choices[idx];
                    if (entry.item.id === qData.target.id) {
                        btn.className = 'choice-btn w-full text-left p-4 md:p-5 rounded-2xl border-2 border-emerald-500 bg-emerald-50 font-black text-xl md:text-2xl text-emerald-900 shadow-md flex items-center gap-4';
                    } else if (idx === selectedIndex && !isCorrect) {
                        btn.className = 'choice-btn w-full text-left p-4 md:p-5 rounded-2xl border-2 border-rose-400 bg-rose-50 font-black text-xl md:text-2xl text-rose-900 opacity-85 flex items-center gap-4';
                    } else {
                        btn.classList.add('opacity-50');
                    }
                });

                const feedbackBox = document.getElementById('feedback-box');
                const resultIcon = document.getElementById('result-icon');
                const resultTitle = document.getElementById('result-title');

                if (isCorrect) {
                    currentScore++;
                    document.getElementById('score-display').textContent = currentScore;
                    feedbackBox.className = 'rounded-2xl p-5 mb-6 flex items-start gap-4 border-2 bg-emerald-50/90 border-emerald-300';
                    resultIcon.textContent = getCelebrationEmoji(currentScore);
                    resultTitle.className = 'text-xl md:text-2xl font-black mb-1 text-emerald-700';
                    resultTitle.innerHTML = addFuriganaToAllKanji(getCelebrationTitle(currentScore));
                    triggerEscalatingCelebration(currentScore);
                } else {
                    feedbackBox.className = 'rounded-2xl p-5 mb-6 flex items-start gap-4 border-2 bg-rose-50/90 border-rose-300';
                    resultIcon.textContent = '💡';
                    resultTitle.className = 'text-xl md:text-2xl font-black mb-1 text-rose-700';
                    resultTitle.innerHTML = addFuriganaToAllKanji('おしい！ここで覚えちゃおう！');
                    playWrongSound();
                }

                // 問題文の【　？　】に、一致させた正解表現（例：「踵を返して」）を当てはめて表示
                const matchedCorrectRuby = formatChoiceStringWithRuby(qData.targetDisplayWord, qData.target);
                const dictCorrectRuby = formatChoiceStringWithRuby(qData.target.cleanWord, qData.target);

                const filledBadge = `<span class="inline-block mx-1 px-3 py-0.5 rounded-xl bg-emerald-100 border-2 border-emerald-500 text-emerald-800 font-black shadow-sm">${matchedCorrectRuby}</span>`;
                const filledQuestionHtml = addFuriganaToAllKanji(qData.questionText).replace(
                    /<span class="blank-box">【　？　】<\/span>/g,
                    filledBadge
                );
                document.getElementById('question-text').innerHTML = filledQuestionHtml;

                document.getElementById('correct-word-display').innerHTML = matchedCorrectRuby;
                const dictNote = document.getElementById('dict-form-note');
                if (qData.targetDisplayWord !== qData.target.cleanWord) {
                    dictNote.classList.remove('hidden');
                    dictNote.innerHTML = `（<ruby>基本形<rt>きほんけい</rt></ruby>：${dictCorrectRuby}）`;
                } else {
                    dictNote.classList.add('hidden');
                }

                document.getElementById('explanation-meaning').innerHTML = addFuriganaToAllKanji(qData.target.meaning);

                const exBox = document.getElementById('explanation-example-box');
                const exText = document.getElementById('explanation-example');
                if (qData.target.example) {
                    exBox.classList.remove('hidden');
                    exText.innerHTML = addFuriganaToAllKanji(`「${qData.target.example}」`);
                } else {
                    exBox.classList.add('hidden');
                }

                const nextBtnText = document.getElementById('next-btn-text');
                if (currentQuestionIndex + 1 >= currentQuizSet.length) {
                    nextBtnText.innerHTML = '👑 <ruby>結果発表<rt>けっかはっぴょう</rt></ruby>をみる';
                } else {
                    nextBtnText.innerHTML = 'つぎの<ruby>問題<rt>もんだい</rt></ruby>へすすむ';
                }
            } catch (err) {
                console.error('Answer handling error:', err);
            } finally {
                const explanationArea = document.getElementById('explanation-area');
                explanationArea.classList.remove('hidden');
                explanationArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function getCelebrationEmoji(score) {
            if (score === 1) return '🎉';
            if (score === 2) return '🎊';
            if (score <= 4) return '🌟';
            if (score <= 7) return '🚀';
            return '👑';
        }

        function getCelebrationTitle(score) {
            if (score === 1) return '大正解！やったね！';
            if (score === 2) return '2問正解！いい調子！';
            if (score === 3) return '3問正解！素晴らしいひらめき！';
            if (score === 4) return '4問正解！絶好調だね！！';
            if (score === 5) return '5問正解！すごすぎる大活躍！！';
            if (score <= 7) return `${score}問正解！天才的な語彙力だ！！`;
            if (score <= 9) return `${score}問正解！無敵のクイズマスター！！`;
            return '10問全問正解！！伝説のグランドチャンピオン！！';
        }

        function triggerEscalatingCelebration(score) {
            playSuccessSound(score);
            if (typeof confetti !== 'function') return;

            try {
                if (score === 1) {
                    confetti({ particleCount: 45, spread: 60, origin: { y: 0.65 } });
                } else if (score === 2) {
                    confetti({ particleCount: 55, angle: 60, spread: 55, origin: { x: 0, y: 0.65 } });
                    confetti({ particleCount: 55, angle: 120, spread: 55, origin: { x: 1, y: 0.65 } });
                } else if (score === 3) {
                    confetti({
                        particleCount: 85,
                        spread: 100,
                        origin: { y: 0.4 },
                        shapes: ['star'],
                        colors: ['#FFD700', '#FFA500', '#FF4500', '#00BFFF']
                    });
                } else if (score === 4) {
                    triggerScreenShake();
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            confetti({
                                particleCount: 75,
                                startVelocity: 35,
                                spread: 360,
                                origin: { x: 0.2 + i * 0.3, y: 0.35 }
                            });
                        }, i * 200);
                    }
                } else {
                    triggerScreenShake();
                    const duration = Math.min(1200 + score * 250, 3500);
                    const end = Date.now() + duration;
                    (function frame() {
                        confetti({ particleCount: 6 + Math.floor(score / 2), angle: 60, spread: 65, origin: { x: 0, y: 0.6 } });
                        confetti({ particleCount: 6 + Math.floor(score / 2), angle: 120, spread: 65, origin: { x: 1, y: 0.6 } });
                        if (Date.now() < end) requestAnimationFrame(frame);
                    })();
                }
            } catch (e) {}
        }

        function triggerScreenShake() {
            const quizScreen = document.getElementById('quiz-screen');
            quizScreen.classList.remove('shake-effect');
            void quizScreen.offsetWidth;
            quizScreen.classList.add('shake-effect');
        }

        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSuccessSound(score) {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const baseNotes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                const noteCount = Math.min(2 + score, baseNotes.length);
                for (let i = 0; i < noteCount; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = score >= 4 ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(baseNotes[i], now + i * 0.08);
                    gain.gain.setValueAtTime(0.18, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.35);
                }
            } catch (e) {}
        }

        function playWrongSound() {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                [240, 200].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.15);
                    gain.gain.setValueAtTime(0.1, now + idx * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.15);
                    osc.stop(now + idx * 0.15 + 0.22);
                });
            } catch (e) {}
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuizSet.length) {
                renderCurrentQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                showFinalScreen();
            }
        });

        function showFinalScreen() {
            document.getElementById('quiz-screen').classList.add('hidden');
            const finalScreen = document.getElementById('final-screen');
            finalScreen.classList.remove('hidden');

            const totalQ = currentQuizSet.length || QUESTIONS_PER_ROUND;
            document.getElementById('final-score').textContent = currentScore;
            document.getElementById('final-max').textContent = totalQ;

            let msg = '';
            if (currentScore === totalQ) {
                document.getElementById('final-emoji').textContent = '👑';
                msg = '全問正解パーフェクト達成！！すべての問題を見事にクリアしました！';
            } else if (currentScore >= 7) {
                document.getElementById('final-emoji').textContent = '🏆';
                msg = 'すばらしい大活躍でした！この調子でどんどん言葉をマスターしよう！';
            } else {
                document.getElementById('final-emoji').textContent = '🌱';
                msg = '最後までよくがんばりました！もう一度チャレンジして記録をのばそう！';
            }
            document.getElementById('final-message').innerHTML = addFuriganaToAllKanji(msg);

            if (currentScore > 0) triggerEscalatingCelebration(Math.max(currentScore, 3));
        }

        document.getElementById('retry-btn').addEventListener('click', () => {
            startNewRound();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.getElementById('replay-celebration-btn').addEventListener('click', () => {
            triggerEscalatingCelebration(Math.max(currentScore, 6));
        });

        initApp();
    </script>
</body>
