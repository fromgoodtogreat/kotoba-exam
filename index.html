<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わくわく3択穴埋めクイズ</title>
    <script>
        // グローバルエラーを画面上に必ず可視化する診断ハンドラ
        window.addEventListener('error', function(e) {
            var box = document.getElementById('debug-banner');
            if (box) {
                box.classList.remove('hidden');
                box.innerHTML += '<div>⚠️ エラー: ' + e.message + ' (行:' + e.lineno + ')</div>';
            }
        });
        window.addEventListener('unhandledrejection', function(e) {
            var box = document.getElementById('debug-banner');
            if (box) {
                box.classList.remove('hidden');
                box.innerHTML += '<div>⚠️ 非同期エラー: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>';
            }
        });
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', 'Yu Gothic', 'Meiryo', sans-serif;
            -webkit-tap-highlight-color: rgba(59, 130, 246, 0.2);
        }
        /* 紙吹雪のキャンバス等がボタンのタップを絶対に邪魔しないように強制 */
        canvas {
            pointer-events: none !important;
        }
        .choice-btn {
            touch-action: manipulation;
            cursor: pointer;
            position: relative;
            z-index: 20;
            user-select: none;
            -webkit-user-select: none;
        }
        .choice-btn * {
            pointer-events: none;
        }
        ruby { ruby-align: center; }
        rt { font-size: 0.6em; color: #4b5563; font-weight: normal; }
        .choice-btn rt { color: inherit; opacity: 0.85; }
        .blank-box {
            display: inline-block;
            background-color: #fef08a;
            color: #d97706;
            border: 2px dashed #f59e0b;
            border-radius: 0.5rem;
            padding: 0.05rem 0.5rem;
            margin: 0 0.2rem;
            font-weight: 900;
        }
        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.2s ease-out forwards; }
        @keyframes screenShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px) rotate(-0.5deg); }
            40%, 80% { transform: translateX(6px) rotate(0.5deg); }
        }
        .shake-effect { animation: screenShake 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-b from-blue-50 to-indigo-100 text-gray-800 min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <!-- エラー診断バナー（エラー発生時のみ表示） -->
    <div id="debug-banner" class="hidden w-full max-w-2xl bg-red-100 border-2 border-red-400 text-red-800 p-3 rounded-xl mb-4 text-xs font-mono"></div>

    <!-- 1. ローディング画面 -->
    <div id="loading-screen" class="w-full max-w-2xl bg-white rounded-3xl shadow-xl p-8 text-center">
        <div class="animate-bounce text-5xl mb-4">📚</div>
        <h1 class="text-2xl font-bold text-blue-600 mb-3">
            <ruby>問題<rt>もんだい</rt></ruby>を<ruby>読<rt>よ</rt></ruby>み<ruby>込<rt>こ</rt></ruby>んでいます...
        </h1>
        <p id="loading-status" class="text-gray-600 mb-4 font-bold">
            プログラムを<ruby>起動<rt>きどう</rt></ruby>しています...
        </p>
        <div class="w-full bg-gray-200 rounded-full h-3 mb-4 overflow-hidden">
            <div id="loading-bar" class="bg-blue-500 h-3 rounded-full transition-all duration-300" style="width: 15%"></div>
        </div>
        <div id="loading-error" class="hidden bg-red-50 border-2 border-red-300 text-red-700 p-4 rounded-xl text-left text-sm mt-4 space-y-2"></div>
    </div>

    <!-- 2. メインのクイズ画面 -->
    <div id="quiz-screen" class="w-full max-w-2xl bg-white rounded-3xl shadow-xl p-6 md:p-8 hidden relative z-10">
        <div class="flex flex-wrap justify-between items-center gap-2 mb-6 border-b-2 border-blue-100 pb-4">
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold text-blue-600">
                    わくわく3<ruby>択<rt>たく</rt></ruby><ruby>穴埋<rt>あなう</rt></ruby>めクイズ
                </h1>
                <span class="text-[11px] text-gray-400 font-bold">v3.0 (タップ確実化版)</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs bg-blue-100 text-blue-700 font-bold px-3 py-1 rounded-full">
                    <ruby>全<rt>ぜん</rt></ruby><span id="total-pool-count">0</span><ruby>語<rt>ご</rt></ruby><ruby>収録<rt>しゅうろく</rt></ruby>
                </span>
                <div class="bg-orange-100 text-orange-600 font-extrabold px-4 py-1.5 rounded-full text-base md:text-lg shadow-sm">
                    🔥 <span id="score-display">0</span><ruby>問<rt>もん</rt></ruby><ruby>正解<rt>せいかい</rt></ruby>！
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-2 text-sm font-bold text-gray-500">
            <div>だい <span id="current-q-num" class="text-blue-600 text-lg">1</span> もん / <span id="max-q-num">10</span></div>
            <div><ruby>未出題<rt>みしゅつだい</rt></ruby>プール: <span id="remaining-pool-count">0</span><ruby>問<rt>もん</rt></ruby></div>
        </div>
        <div class="w-full bg-gray-100 rounded-full h-2.5 mb-6">
            <div id="quiz-progress-bar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
        </div>

        <!-- 問題文エリア -->
        <div id="question-box" class="text-lg md:text-2xl font-bold leading-loose mb-6 bg-blue-50/80 p-6 rounded-2xl border-2 border-blue-200 shadow-inner">
            <div id="question-type-badge" class="inline-block text-xs font-bold bg-indigo-500 text-white px-2.5 py-1 rounded-md mb-3"></div>
            <p id="question-text" class="text-gray-800 leading-loose"></p>
        </div>

        <!-- 3択ボタンコンテナ（親要素でイベントを一括キャッチ） -->
        <div id="choices-container" class="flex flex-col gap-4 relative z-20"></div>

        <!-- 解答・解説エリア -->
        <div id="explanation-area" class="hidden mt-8 pt-6 border-t-2 border-dashed border-gray-200 text-center animate-pop relative z-20">
            <div class="flex items
